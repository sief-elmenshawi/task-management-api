services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: taskmanagement-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-TaskManager@2026}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: taskmanagement-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/TaskManagement.Api/Dockerfile
    container_name: taskmanagement-api
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      Logging__LogLevel__Microsoft.EntityFrameworkCore: "Warning"
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: "Warning"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TaskManagement;User Id=sa;Password=${SA_PASSWORD:-TaskManager@2026};TrustServerCertificate=True;MultipleActiveResultSets=True"
      ConnectionStrings__Redis: "redis:6379"
      JwtSettings__Key: "${JWT_KEY:?JWT_KEY must be set in .env - see .env.example}"
      JwtSettings__Issuer: "TaskManagement"
      JwtSettings__Audience: "TaskManagementClients"
      JwtSettings__ExpiryMinutes: "15"
      Cors__AllowedOrigins__0: "${CORS_ORIGIN:-http://localhost:5173}"
      Swagger__Enabled: "true"
      Worker__Concurrency: "${WORKER_CONCURRENCY:-3}"
      RateLimiting__Auth__PermitLimit: "${RATE_LIMIT_AUTH_PERMIT:-10}"
      RateLimiting__Auth__WindowSeconds: "${RATE_LIMIT_AUTH_WINDOW:-60}"
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  sqlserver_data:
  redis_data:
